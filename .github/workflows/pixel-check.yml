# Cloud CPU check of the pixel experiment: tests, then the same script the GPU run uses, in smoke mode. Commits nothing.
name: pixel-check

on:
  push:
    branches:
      - mission/world-model-techniques
    paths:
      - src/intr/pixel/**
      - experiments/thread_p.py
      - scripts/gpu_run.sh
      - tests/test_pixel_*.py
      - .github/workflows/pixel-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple numpy pytest
      - name: Tests
        run: python -m pytest -q --tb=short tests/test_pixel_*.py
      - name: Smoke through the GPU script
        run: bash scripts/gpu_run.sh --smoke
      - name: Upload logs and smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pixel-smoke
          path: |
            results/thread_p_gpu/**
          if-no-files-found: warn
          retention-days: 14
