# Runs one thread's experiments, one seed-and-family job at a time, and commits the merged results to this branch.
#
# To start a run, set .ci/run-request.json on main, for example
#     {"thread": "a", "seeds": [0], "families": ["pendulum", "puck"], "note": "pilot"}
# then start this workflow from the Actions tab. Pull before changing the request, since a run may have committed.
#
# This cannot loop: it starts only by hand, and the merge job checks that its commit changes only the one results file.
# The setup job runs only on main, and the merge job pushes only to main.

name: experiments

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash  # as written, this gives -eo pipefail, which the tee below relies on

env:
  TORCH_VERSION: "2.11.0"
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      thread: ${{ steps.request.outputs.thread }}
      seeds: ${{ steps.request.outputs.seeds }}
      families: ${{ steps.request.outputs.families }}
      seeds_args: ${{ steps.request.outputs.seeds_args }}
      families_args: ${{ steps.request.outputs.families_args }}
      note: ${{ steps.request.outputs.note }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate the run request
        id: request
        run: python experiments/ci_tools.py request --file .ci/run-request.json --root . --github-output "$GITHUB_OUTPUT"

  tests:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        timeout-minutes: 10
        run: python -m pip install "torch==${TORCH_VERSION}" --index-url "$TORCH_INDEX" --extra-index-url https://pypi.org/simple numpy pytest
      - name: Run tests
        run: python -m pytest -q

  experiments:
    needs: [setup, tests]
    name: thread ${{ needs.setup.outputs.thread }} seed ${{ matrix.seed }} ${{ matrix.family }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.setup.outputs.seeds) }}
        family: ${{ fromJSON(needs.setup.outputs.families) }}
    env:
      THREAD: ${{ needs.setup.outputs.thread }}
      SEED: ${{ matrix.seed }}
      FAMILY: ${{ matrix.family }}
    steps:
      - name: Record the start time
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        timeout-minutes: 10
        run: python -m pip install "torch==${TORCH_VERSION}" --index-url "$TORCH_INDEX" --extra-index-url https://pypi.org/simple numpy pytest
      # A step timeout below the job's leaves time to upload the log. Only a finished job writes its results, so a job
      # that times out has a log and no results (Thread C: a file with its selection and no jobs). The merge reports it.
      - name: Run the experiment
        id: run
        timeout-minutes: 335
        run: |
          out="$RUNNER_TEMP/job_out"
          mkdir -p "$out"
          python -m pip list 2>/dev/null | grep -iE '^(torch|numpy) ' | tee "$out/run.log"
          python -u "experiments/thread_${THREAD}.py" --full --seed-list "$SEED" --families "$FAMILY" \
            --threads "$(nproc)" --out "$out" 2>&1 | tee -a "$out/run.log"
      - name: Record the job's outcome and machine
        if: always()
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          python experiments/ci_tools.py job-info --out "$RUNNER_TEMP/job_out/job_info.json" --thread "$THREAD" \
            --seed "$SEED" --family "$FAMILY" --outcome "$OUTCOME" --started-epoch "$JOB_STARTED"
      # The name is unique within a run. overwrite lets "Re-run failed jobs" replace the failed attempt's artifact.
      # The globs leave out .tmp files.
      - name: Upload results and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-${{ needs.setup.outputs.thread }}-s${{ matrix.seed }}-${{ matrix.family }}
          path: |
            ${{ runner.temp }}/job_out/*.json
            ${{ runner.temp }}/job_out/*.log
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  merge:
    needs: [setup, tests, experiments]
    # Also after failed or cancelled experiments, to keep whatever finished. If setup or tests failed, nothing ran.
    if: ${{ always() && needs.setup.result == 'success' && needs.tests.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write  # to push the results commit
      actions: read  # to read minutes per job
    env:
      THREAD: ${{ needs.setup.outputs.thread }}
      SEEDS_ARGS: ${{ needs.setup.outputs.seeds_args }}
      FAMILIES_ARGS: ${{ needs.setup.outputs.families_args }}
      NOTE: ${{ needs.setup.outputs.note }}
      BRANCH: ${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Two checkouts: "code" is the commit the experiments ran from, so the summary uses that code even if the branch
      # moved. "publish" follows the branch tip, and only it holds push credentials.
      - name: Check out the code that ran
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: code
          persist-credentials: false
      - name: Check out the branch to publish to
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          path: publish
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/pyproject.toml
      - name: Install dependencies
        timeout-minutes: 10
        run: python -m pip install "torch==${TORCH_VERSION}" --index-url "$TORCH_INDEX" --extra-index-url https://pypi.org/simple numpy
      - name: Download job artifacts
        continue-on-error: true  # zero artifacts is a case the next step reports
        uses: actions/download-artifact@v8
        with:
          pattern: job-*
          path: artifacts
      # On a lost push race this merges again on the new tip, rather than running git rebase. Two runs both rewrite the
      # same JSON file, so a text rebase would conflict or, worse, combine hunks into a file nobody computed.
      - name: Merge and commit
        run: |
          target="results/thread_${THREAD}/thread_${THREAD}_full.json"
          if [ "$GITHUB_REF" != "refs/heads/${BRANCH}" ] || [ "$BRANCH" != "main" ]; then
            echo "::error::refusing to publish to ${BRANCH} from ${GITHUB_REF}"
            exit 1
          fi
          merged="$RUNNER_TEMP/merged"
          mkdir -p "$merged" artifacts
          mapfile -t inputs < <(find artifacts -type f -name "thread_${THREAD}_full.json" | sort)
          echo "Found ${#inputs[@]} result file(s)."
          git -C publish config user.name "github-actions[bot]"
          git -C publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          published=no
          for attempt in 1 2 3 4 5 6; do
            if ! git -C publish fetch --quiet origin "$BRANCH"; then
              sleep $((attempt * 20))
              continue
            fi
            git -C publish checkout --quiet --force --detach FETCH_HEAD
            git -C publish clean -fdq
            rc=0
            # $SEEDS_ARGS and $FAMILIES_ARGS are validated, and split into words on purpose.
            python code/experiments/merge_results.py --thread "$THREAD" --inputs "${inputs[@]}" \
              --prior "publish/$target" --out "publish/$target" \
              --expected-seeds $SEEDS_ARGS --expected-families $FAMILIES_ARGS \
              --report "$merged/merge_report.json" --markdown "$merged/merge_report.md" \
              --commit-message "$merged/commit_message.txt" \
              --note="$NOTE" --run-url "$RUN_URL" --sha "$GITHUB_SHA" || rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "::error::no job finished, so there is nothing to commit"
              cat "$merged/merge_report.md" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            elif [ "$rc" -eq 2 ]; then
              echo "::error::the merge was refused, and nothing was committed; job artifacts are kept"
              cat "$merged/merge_report.md" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            elif [ "$rc" -ne 0 ]; then
              echo "::error::the merge failed with exit code $rc, and nothing was committed; job artifacts are kept"
              exit "$rc"
            fi

            git -C publish add -- "$target"
            if git -C publish diff --cached --quiet; then
              echo "Every finished job is already in $target."
              published=yes
              break
            fi
            staged="$(git -C publish diff --cached --name-only)"
            if [ "$staged" != "$target" ]; then
              echo "::error::refusing to commit anything but $target; staged: $staged"
              exit 1
            fi
            cp "publish/$target" "$merged/"
            size="$(wc -c < "publish/$target")"
            if [ "$size" -ge 95000000 ]; then
              echo "::error::$target is $size bytes, too large to push; it is in the merged artifact"
              exit 1
            elif [ "$size" -ge 50000000 ]; then
              echo "::warning::$target is $size bytes, above GitHub's recommended 50 MB"
            fi
            git -C publish commit --quiet -F "$merged/commit_message.txt"
            if git -C publish push origin "HEAD:refs/heads/${BRANCH}"; then
              published=yes
              break
            fi
            echo "Push attempt $attempt lost a race; merging again on the new branch tip."
            sleep $((attempt * 20))
          done
          if [ "$published" != yes ]; then
            echo "::error::could not push after 6 attempts; any merged file is in the merged artifact"
            exit 1
          fi
          cat "$merged/merge_report.md" >> "$GITHUB_STEP_SUMMARY"
          # A partly finished run commits what it has, and the experiments job already shows red for the rest.
          if grep -q '"missing": \[$' "$merged/merge_report.json"; then
            echo "::warning::some seed-family pairs are missing; see the merge report"
          fi
      - name: Upload the merged file and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: merged-${{ needs.setup.outputs.thread }}
          path: ${{ runner.temp }}/merged/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
      - name: Report minutes per job
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python code/experiments/ci_tools.py minutes --jobs-json "$RUNNER_TEMP/jobs.json" >> "$GITHUB_STEP_SUMMARY"
