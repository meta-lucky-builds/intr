# All tests on cloud CPU, then the pixel experiment's own script in smoke mode. Commits nothing.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple numpy pytest
      - name: Tests
        run: python -m pytest -q --tb=short
      - name: Smoke one family through the GPU script
        run: bash scripts/gpu_run.sh --smoke --families pendulum
      - name: Smoke through the GPU script
        run: bash scripts/gpu_run.sh --smoke
      - name: Upload logs and smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pixel-smoke
          path: |
            results/thread_p_gpu/**
          if-no-files-found: warn
          retention-days: 14
