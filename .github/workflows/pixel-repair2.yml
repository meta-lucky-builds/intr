# Round two and the last round of the encoder repair, on cloud CPU: action repeat with the noise-floor diagnostic, rung 0 of the pilot on seed 1010.
# The runner exits after that, so no registered seed starts. Registered in docs/HYPOTHESES.md, Thread P. Commits nothing.
name: pixel-repair2

on:
  push:
    branches:
      - mission/world-model-techniques
    paths:
      - .github/workflows/pixel-repair2.yml

permissions:
  contents: read

jobs:
  repair:
    name: repair ${{ matrix.family }} ${{ matrix.arm.variant }} repeat ${{ matrix.arm.repeat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        family: [pendulum, drone, puck]
        arm:
          - { variant: idm, repeat: 1 }
          - { variant: idm, repeat: 3 }
          - { variant: state, repeat: 3 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple numpy pytest
      - name: Pilot at rung 0, then stop
        timeout-minutes: 330
        env:
          INTR_P_DETACHED: "1"
        run: bash scripts/gpu_run.sh --allow-cpu --skip-tests --no-publish --families ${{ matrix.family }} --repair-variant ${{ matrix.arm.variant }} --action-repeat ${{ matrix.arm.repeat }}
      - name: Upload pilot records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pilot-${{ matrix.family }}-${{ matrix.arm.variant }}-repeat${{ matrix.arm.repeat }}
          path: |
            results/thread_p_gpu/**/*.txt
            results/thread_p_gpu/**/*.json
            results/thread_p_gpu/**/*.log
          if-no-files-found: warn
          retention-days: 14
