[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intr"
version = "0.1.0"
description = "Pre-registered tests of test-time adaptation for small world models, from state and from pixels"
requires-python = ">=3.11"
dependencies = ["torch", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
